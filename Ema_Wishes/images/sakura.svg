<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Default sakura avatar</title>
  <desc id="desc">A soft pink circular avatar with a sakura flower.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4f8"/>
      <stop offset="1" stop-color="#f6b7cf"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="120" fill="url(#bg)"/>
  <circle cx="120" cy="120" r="88" fill="none" stroke="#ffffff" stroke-width="5" opacity=".8"/>
  <g transform="translate(120 120)" fill="#df648f">
    <ellipse rx="26" ry="46" transform="translate(0 -34) rotate(0)"/>
    <ellipse rx="26" ry="46" transform="translate(32 -10) rotate(72)"/>
    <ellipse rx="26" ry="46" transform="translate(20 28) rotate(144)"/>
    <ellipse rx="26" ry="46" transform="translate(-20 28) rotate(216)"/>
    <ellipse rx="26" ry="46" transform="translate(-32 -10) rotate(288)"/>
    <circle r="17" fill="#fff2c8"/>
    <circle r="6" fill="#bd456f"/>
  </g>
</svg>
